<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fine Print</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="panel">
    <header>
      <div class="brand"><span class="mark">F</span> Fine Print <span class="dim">dev</span></div>
      <div class="actions">
        <button id="brief-chip" class="chip" title="Edit your investor brief">brief: not set</button>
        <button id="new" title="Start a new thread">New</button>
        <button id="opts" title="Keys and settings">Settings</button>
        <button id="close" title="Hide" hidden>✕</button>
      </div>
    </header>
    <!-- Onboarding (placeholder — Carlos replaces with design A "Set your brief") -->
    <section id="setup" class="setup" hidden>
      <h2 class="setup-title">Set your brief.</h2>
      <p class="dim">Every listing you open gets scored against it. Four inputs, once.</p>
      <div class="setup-row">
        <label>Budget<input id="s-budget" inputmode="numeric" placeholder="800,000" /></label>
        <label>Deposit <span id="s-deposit-pct" class="dim"></span><input id="s-deposit" inputmode="numeric" placeholder="160,000" /></label>
      </div>
      <label>Min gross yield <strong id="s-yield-out">4.0%</strong>
        <input id="s-yield" type="range" min="3" max="6" step="0.1" value="4" />
      </label>
      <div class="setup-label">Hold period</div>
      <div class="segmented" id="s-hold">
        <button data-years="3">3y</button><button data-years="5">5y</button><button data-years="10">10y</button><button data-years="15">15y+</button>
      </div>
      <button id="s-save" class="primary">Save brief &amp; read this listing</button>
      <p class="setup-foot dim">Stored locally · data by Microburbs · not financial advice</p>
    </section>
    <div id="listing" class="listing dim">No listing detected — open a realestate.com.au property page.</div>
    <!-- Data card: placeholder rendering of the brief (Carlos replaces with widgets).
         Contract: docs/brief.md · event: window 'fineprint:brief' -->
    <section id="data" class="data" hidden>
      <div id="matched" class="matched"></div>
      <dl id="figures" class="figures"></dl>
      <div class="data-actions">
        <button id="read" class="primary">Read this listing</button>
        <button id="copy-brief" title="Copy the brief JSON (dev)">Copy JSON</button>
      </div>
    </section>
    <main id="thread"></main>
    <div class="starters" id="starters">
      <button>What will it cost me weekly?</button>
      <button>What should I offer?</button>
      <button>Is new supply a risk here?</button>
    </div>
    <form id="ask">
      <textarea id="input" rows="2" placeholder="Ask anything about this listing…"></textarea>
      <button type="submit" id="send">↑</button>
    </form>
    <script type="module" src="panel.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fine Print — settings</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="options">
    <h1>Fine Print settings</h1>
    <p class="dim">Stored in this browser only (chrome.storage.local). Never committed.</p>

    <fieldset>
      <legend>LLM</legend>
      <label>Provider
        <select id="provider">
          <option value="deepseek">DeepSeek</option>
          <option value="openrouter">OpenRouter</option>
        </select>
      </label>
      <label>Model <input id="model" placeholder="deepseek-chat  ·  or e.g. deepseek/deepseek-chat on OpenRouter" /></label>
      <label>DeepSeek API key <input id="key-deepseek" type="password" autocomplete="off" /></label>
      <label>OpenRouter API key <input id="key-openrouter" type="password" autocomplete="off" /></label>
    </fieldset>

    <fieldset>
      <legend>Microburbs</legend>
      <label>Source
        <select id="mbSource">
          <option value="test">Test data (bundled, no network)</option>
          <option value="proxy">Demo proxy (uses your Chrome session — visit microburbs-api-demos.vercel.app first)</option>
          <option value="api">Hackathon API (team key)</option>
        </select>
      </label>
      <label>Team key <input id="key-microburbs" type="password" autocomplete="off" /></label>
    </fieldset>

    <fieldset>
      <legend>Investor brief</legend>
      <label>Budget ($) <input id="budget" type="number" /></label>
      <label>Deposit ($) <input id="deposit" type="number" /></label>
      <label>Minimum gross yield (%) <input id="minYield" type="number" step="0.1" /></label>
      <label>Hold (years) <input id="holdYears" type="number" /></label>
    </fieldset>

    <button id="save">Save</button> <span id="saved" class="dim"></span>
    <script type="module" src="options.js"></script>
  </body>
</html>
